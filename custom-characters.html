<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Original people · Game Arena Tycoon</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e6e5;color:#243b3d;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:24px;left:28px;max-width:370px}small{font-size:10px;font-weight:750;letter-spacing:2px;color:#547673}h1{font-size:30px;font-weight:650;letter-spacing:-1px;margin:8px 0}p{line-height:1.65;font-size:13px;color:#587174}.controls{position:absolute;bottom:22px;left:24px;right:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;border:1px solid #bdceca;border-radius:14px;background:#fffffff0}select,button,a{border:1px solid #b7c6c2;border-radius:8px;background:#f7faf8;color:#203e3a;padding:10px 12px;font:inherit;font-size:12px}button,a{cursor:pointer}button[aria-pressed=true]{background:#204e48;color:white}#status{position:absolute;right:26px;top:26px;font-size:11px;color:#587174}a{margin-left:auto;text-decoration:none}@media(max-width:600px){header{left:16px;top:16px;max-width:230px}h1{font-size:22px}header p{font-size:11px}.controls{left:10px;right:10px;bottom:10px;padding:10px;gap:6px}select,button,a{font-size:11px;padding:8px}#status{right:12px;top:160px}}
#wardrobe{position:relative}summary{cursor:pointer;padding:10px 12px;font-size:12px}#wardrobe-panel{position:fixed;bottom:104px;left:24px;right:24px;max-height:42vh;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;padding:16px;border:1px solid #b7c6c2;border-radius:14px;background:#fffffff5;box-shadow:0 12px 30px #243b3d22}#wardrobe label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}#wardrobe select{max-width:70%}input[type=color]{width:48px;height:34px;padding:2px;border:1px solid #b7c6c2;border-radius:6px;background:#fff}@media(max-width:600px){#wardrobe-panel{left:10px;right:10px;bottom:228px;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-height:42vh}#wardrobe label{font-size:11px}summary{font-size:11px;padding:8px}}
</style></head>
<body><canvas id="studio"></canvas><header><small>BUILD &amp; BOOT · ORIGINAL PEOPLE</small><h1>Meet your lounge.</h1><p>Original people. Mix hairstyles, clothes, shoes and colours. Drag to turn the view. Scroll to move closer.</p></header><div id="status" role="status">Preparing character…</div>
<nav class="controls" aria-label="Character preview"><select id="character" aria-label="Character"></select><select id="pose" aria-label="Animation"><option>Idle</option><option>Walk</option><option>Gaming</option><option>SitDown</option><option>StandUp</option><option>Wave</option><option>CheckIn</option></select><select id="chair" aria-label="Chair tier"><option value="1">Office chair</option><option value="2">Gaming chair</option><option value="3">Ergonomic chair</option><option value="4">Executive chair</option></select><button id="random-look">Random look</button><details id="wardrobe"><summary>Customize look</summary><div id="wardrobe-panel"></div></details><button id="portrait" aria-pressed="false">Face close-up</button><button id="front">Front view</button><button id="side">Side view</button><a href="/">Enter the lounge →</a></nav>
<script type="module" src="/src/characters/CharacterStudio.ts"></script></body></html>
